<body>
    <h1>Ethiopian Landmarks & Location</h1>

    <!-- Figure with Image and Figcaption -->
    <figure>
        <img 
            src="https://media.tacdn.com/media/attractions-splice-spp-674x446/07/b0/60/cf.jpg" 
            alt="Rock-hewn church of Bete Giyorgis, one of the eleven monolithic churches in Lalibela, Ethiopia" 
            width="640" 
            height="420" 
            loading="lazy"
        >
        <figcaption>Bete Giyorgis - One of the rock-hewn churches of Lalibela, a UNESCO World Heritage site.</figcaption>
    </figure>

    <!-- Map iframe with title -->
    <h2>Location in Lalibela, Ethiopia</h2>
