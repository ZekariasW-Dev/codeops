<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 1 - Flexbox Navbar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1B4D8E;
            color: white;
            padding: 0 24px;
            height: 64px;
            border-radius: 8px;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 0.95rem;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        .btn {
            background: #D4A027;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .btn:hover {
            background: #b8891f;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">🏠 Habesha Eatery</div>
        <div class="nav-links">
            <a href="#">Menu</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
            <button class="btn">Reserve</button>
        </div>
    </nav>
</body>
</html>
