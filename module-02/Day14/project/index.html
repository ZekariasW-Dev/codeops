<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 5 - Product Card with Badge</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background: #f7fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .product-card {
            position: relative;
            width: 320px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .product-image {
            background: #1B4D8E;
            color: white;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        .product-info {
            padding: 20px;
        }

        .product-info h2 {
            font-size: 1.4rem;
            margin-bottom: 8px;
            color: #1B4D8E;
        }

        .product-info p {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .product-info .price {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2E7D32;
        }

        .product-info .btn {
            display: inline-block;
            background: #1B4D8E;
            color: white;
            padding: 10px 24px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 12px;
        }

        .product-info .btn:hover {
            background: #163e73;
        }

        .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #DC2626;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(220, 38, 38, 0.3);
        }
    </style>
</head>
<body>
    <div class="product-card">
        <div class="badge">🔥 SALE</div>

        <div class="product-image">☕</div>

        <div class="product-info">
            <h2>Ethiopian Coffee</h2>
            <p>Single-origin coffee beans from Yirgacheffe. Freshly roasted.</p>
            <div class="price">250 ETB</div>
            <br>
            <button class="btn">Add to Cart</button>
        </div>
    </div>
</body>
</html>
