<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addis Market Shopping List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Addis Market</h1>
        <p class="subtitle">My Shopping List</p>

        <form id="add-form">
            <div class="form-group">
                <label for="name">Item Name</label>
                <input 
                    type="text" 
                    id="name" 
                    placeholder="Example: Teff"
                >
            </div>

            <div class="form-group">
                <label for="price">Price (ETB)</label>
                <input 
                    type="number" 
                    id="price" 
                    placeholder="Example: 500"
                    min="1"
                >
            </div>

            <button type="submit">Add Item</button>
        </form>

        <p id="error"></p>

        <h2>Shopping Items</h2>

        <ul id="list"></ul>

        <div class="total">
            <strong>Total:</strong>
            <span id="total">0 ETB</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
