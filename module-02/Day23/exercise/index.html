<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheger Transit</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
<header>
<h1 id="h1">Sheger Transit</h1>
<div class="header-controls">
    <input id="search" placeholder="Search routes..." />
    <label for="sort">Sort routes</label>
    <select id="sort">
        <option value="default">Default order</option>
        <option value="price-asc">Price: low to high</option>
        <option value="price-desc">Price: high to low</option>
        <option value="name-asc">Name: A to Z</option>
        <option value="name-desc">Name: Z to A</option>
    </select>
</div>
</header>
<main id="main">
<section id="routes">
    <p>Routes</p>
</section>
<aside id="fav">
    <p>Favorites</p>
    <ul id="fav-list">
        
    </ul>
</aside>
</main>
<footer><p><i>Bole, Addis Ababa · Sheger Transit</i></p></footer>
<script src="app.js"></script>
</body>
</html>
